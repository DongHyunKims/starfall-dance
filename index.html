<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0620">
  <meta name="description" content="STARFALL — 카메라 앞에서 NOVA를 거울처럼 따라 추는 리듬 댄스 게임">
  <title>STARFALL — NOVA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230b0620'/%3E%3Cpath fill='%23ffc24a' d='M12 2C12.8 8.3 15.7 11.2 22 12 15.700 12.800 12.800 15.700 12 22 11.200 15.700 8.300 12.800 2 12 8.300 11.200 11.200 8.300 12 2Z'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;900&family=Unbounded:wght@600;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- js/hud.js replaces the contents of #hud; the splash below only covers module loading -->
  <div id="hud" class="sf" data-screen="boot">
    <div class="boot" id="boot">
      <div class="logo logo--sm" role="img" aria-label="STARFALL">
        <span class="logo__word"><b>STAR</b><b class="logo__fall">FALL</b></span>
        <span class="logo__tag">COSMIC DANCE STAGE</span>
      </div>
      <p class="boot__msg" id="boot-msg">무대를 준비하는 중…</p>
    </div>
  </div>

  <video id="cam" playsinline muted></video>

  <noscript>
    <p style="position:fixed;inset:0;display:grid;place-items:center;margin:0;color:#f6f1ff;background:#0b0620;font-family:sans-serif;z-index:99">
      STARFALL을 플레이하려면 자바스크립트를 켜 주세요.
    </p>
  </noscript>

  <script>
    // If the game modules fail to load, say so instead of leaving the splash up forever.
    (function () {
      function fail(e) {
        var t = e && e.target;
        // ignore non-script resource failures (fonts, icons): the game still runs without them
        if (t && t !== window && t.tagName && t.tagName !== 'SCRIPT') return;
        var msg = document.getElementById('boot-msg');
        if (!msg) return; // the HUD already took over
        msg.textContent = '게임을 불러오지 못했어요. 네트워크를 확인하고 새로고침해 주세요.';
        msg.className = 'boot__msg is-error';
      }
      window.addEventListener('error', fail, true);
      window.addEventListener('unhandledrejection', fail);
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
